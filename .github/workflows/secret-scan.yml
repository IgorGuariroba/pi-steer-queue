# Secret scan server-side (fallback dos padrões genéricos do secret scanning, indisponíveis em repo de usuário).
# INVARIANTS:
# - trigger `pull_request` (nunca pull_request_target): o código do PR só é lido pelo scanner, nunca executado
# - token somente leitura; comentários no PR desligados
# - `name:` fixo do job: o ruleset exige este nome de check literal
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
